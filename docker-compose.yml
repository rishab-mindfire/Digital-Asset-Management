version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_STRING=mongodb://mongo:27018/asset-management-production
      - RABBITMQ_URL=amqp://rabbitmq:73
      - FRONTEND_URL=http://localhost:3002
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - uploads_data:/backend-app/storage
    networks:
      - app-network

  mongo:
    image: mongo:6
    container_name: mongo
    command: mongod --port 27018
    restart: always
    ports:
      - "27018:27018"
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    environment:
      # This tells RabbitMQ to listen on port 73 internally
      - RABBITMQ_NODE_PORT=73
      - RABBITMQ_DIST_PORT=25672
    ports:
      - "73:73"           # Host Port 73 -> Container Port 73
      - "15672:15672"     # Management UI (Dashboard)
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
